# 在 push / pull_request 时运行官方校验与本地自检。
#
# 安全边界:
#   * 不引用任何仓库 secret、不向外部服务上传代码。
#   * 不调用 DeepSeek worker，也不读取 DEEPSEEK_API_KEY。
#   * 只读权限，不写回仓库内容。
name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate plugin (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML (official validators import yaml)
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Provision CODEX_HOME
        run: |
          set -euo pipefail
          codex_home="${RUNNER_TEMP}/codex-home"
          mkdir -p "${codex_home}/skills/.system"
          printf 'CODEX_HOME=%s\n' "${codex_home}" >> "${GITHUB_ENV}"

      - name: Provision official Codex system skills
        run: |
          set -euo pipefail
          system_skills="${CODEX_HOME}/skills/.system"
          validator="${system_skills}/plugin-creator/scripts/validate_plugin.py"
          if [[ ! -f "${validator}" ]]; then
            npm install --global @openai/codex
            # 官方系统技能（含 validator）在 app-server 首次启动时写入 CODEX_HOME。
            timeout 90 codex app-server >/dev/null 2>&1 || true
          fi
          if [[ ! -f "${validator}" ]]; then
            # 兜底：从官方 openai/skills 仓库取系统技能目录。
            git clone --depth 1 https://github.com/openai/skills.git "${RUNNER_TEMP}/openai-skills"
            echo "CODEX_SYSTEM_SKILLS_DIR=${RUNNER_TEMP}/openai-skills/skills/.system" >> "${GITHUB_ENV}"
          fi

      - name: Official plugin validator and skill quick_validate
        run: scripts/run-official-validators.sh

      - name: Shell syntax (bash -n)
        run: |
          set -euo pipefail
          checked=0
          for script in scripts/*; do
            [[ -f "${script}" ]] || continue
            head -n 1 -- "${script}" | grep -q '^#!' || continue
            bash -n -- "${script}"
            checked=$((checked + 1))
          done
          echo "bash -n checked ${checked} script(s)"
          [[ "${checked}" -gt 0 ]]

      - name: Local self-check
        run: scripts/validate-plugin.sh
